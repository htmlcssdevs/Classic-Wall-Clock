<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Wall Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="clock" id="clock" role="img" aria-label="Analog clock">
        <!-- Numbers and Dots will be injected by JS -->
        <div class="hand hand-hour" id="hourHand"></div>
        <div class="hand hand-minute" id="minuteHand"></div>
        <div class="hand hand-second" id="secondHand"></div>
        <div class="center-pin"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
